<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>becringeorfail.com is for sale</title>
  <meta name="description" content="becringeorfail.com is for sale. Make an offer.">
  <meta name="robots" content="index,follow">
  <style>
    :root {
      --bg: #0f1115;
      --card: #181b22;
      --text: #f4f1ea;
      --muted: #b7b1a6;
      --line: rgba(244, 241, 234, 0.12);
      --accent: #e8c56b;
      --accent-ink: #1a1406;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Times New Roman", serif;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(232, 197, 107, 0.08), transparent 60%),
        var(--bg);
      color: var(--text);
      line-height: 1.5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
    }

    main {
      width: min(36rem, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 1.25rem;
      padding: 2.5rem 2rem 2rem;
      text-align: center;
    }

    p.kicker {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 1rem;
    }

    h1 {
      font-size: clamp(1.7rem, 6vw, 2.35rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin: 0 0 0.85rem;
    }

    .lead {
      color: var(--muted);
      font-size: 1.05rem;
      margin: 0 auto 1.75rem;
      max-width: 28rem;
    }

    form {
      display: grid;
      gap: 0.75rem;
      text-align: left;
    }

    label {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }

    input, textarea {
      width: 100%;
      margin-top: 0.3rem;
      border: 1px solid var(--line);
      border-radius: 0.65rem;
      background: #12141a;
      color: var(--text);
      font: inherit;
      padding: 0.7rem 0.8rem;
    }

    input:focus, textarea:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    textarea { min-height: 6.5rem; resize: vertical; }

    button, .button {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-weight: 600;
      font-size: 1rem;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-ink);
      padding: 0.85rem 1.2rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    button { width: 100%; margin-top: 0.4rem; }
    button:hover, .button:hover { filter: brightness(1.06); }

    .or {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--muted);
      font-size: 0.9rem;
      margin: 1.25rem 0 0;
    }

    .or a {
      color: var(--text);
    }

    .status {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      margin: 0.85rem 0 0;
      min-height: 1.2em;
      color: var(--muted);
    }

    @media (max-width: 420px) {
      main { padding: 2rem 1.25rem 1.6rem; }
    }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Domain for sale</p>
    <h1>becringeorfail.com is for sale</h1>
    <p class="lead">This domain is available for purchase. If you’d like to buy it, send an offer and a way to reach you.</p>

    <!--
      Contact setup:
      1) Preferred once a Formspree form exists: set FORMSPREE_ID below
         (create a form at https://formspree.io and send notifications
         to hello@marcustravis.com, not a personal Gmail address).
      2) Until then, the form falls back to a prefilled mailto for
         hello@marcustravis.com, which already forwards via Email Routing.
    -->
    <form id="offer-form" method="POST" action="#">
      <div>
        <label for="name">Name</label>
        <input id="name" name="name" type="text" autocomplete="name" required>
      </div>
      <div>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div>
        <label for="offer">Offer (USD, optional)</label>
        <input id="offer" name="offer" type="text" inputmode="decimal" placeholder="e.g. 500">
      </div>
      <div>
        <label for="message">Message</label>
        <textarea id="message" name="message" required placeholder="Tell me about your offer."></textarea>
      </div>
      <input type="hidden" name="_subject" value="Offer for becringeorfail.com">
      <button type="submit">Make an offer</button>
    </form>
    <p class="or">Or email <a href="mailto:hello@marcustravis.com?subject=Offer%20for%20becringeorfail.com">hello@marcustravis.com</a></p>
    <p class="status" id="status" role="status"></p>
  </main>
  <script>
    const FORMSPREE_ID = ""; // e.g. "xyzabcde"
    const MAILTO = "hello@marcustravis.com";
    const form = document.getElementById("offer-form");
    const status = document.getElementById("status");

    if (FORMSPREE_ID) {
      form.action = "https://formspree.io/f/" + FORMSPREE_ID;
    }

    form.addEventListener("submit", async (event) => {
      if (!FORMSPREE_ID) {
        event.preventDefault();
        const name = form.name.value.trim();
        const email = form.email.value.trim();
        const offer = form.offer.value.trim();
        const message = form.message.value.trim();
        const body = [
          "Name: " + name,
          "Email: " + email,
          offer ? "Offer: " + offer : "",
          "",
          message
        ].filter(Boolean).join("\n");
        window.location.href =
          "mailto:" + MAILTO +
          "?subject=" + encodeURIComponent("Offer for becringeorfail.com") +
          "&body=" + encodeURIComponent(body);
        return;
      }

      event.preventDefault();
      status.textContent = "Sending…";
      try {
        const response = await fetch(form.action, {
          method: "POST",
          body: new FormData(form),
          headers: { Accept: "application/json" }
        });
        if (!response.ok) throw new Error("Request failed");
        form.reset();
        status.textContent = "Thanks. Your offer is on its way.";
      } catch (err) {
        status.textContent = "The form couldn’t send. Email hello@marcustravis.com instead.";
      }
    });
  </script>
</body>
</html>
